name: Build iOS (Unsigned IPA) & Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build_android:
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Android platform wrapper if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org dev.embystream .
          fi
      - run: flutter pub get
           - name: Patch Android plugins for AGP 9 & SDK 36
        run: |
          find ~/.pub-cache -path "*/flutter_inappwebview_android*/android/build.gradle" -exec sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' {} +
          find ~/.pub-cache -path "*/file_picker*/android/build.gradle" -exec sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*34/compileSdk 36/g' {} +
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EmbyStreamVault-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios_unsigned:
    needs: analyze_and_test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate iOS platform wrapper & configure Info.plist
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org dev.embystream .
          fi
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r EmbyStreamVault-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EmbyStreamVault-iOS-Unsigned-IPA
          path: EmbyStreamVault-unsigned.ipa
