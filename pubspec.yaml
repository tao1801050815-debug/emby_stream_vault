name: emby_stream_vault
description: Emby-style cross-platform media library, WebView sniffer (MissAV/JavDB login & CF bypass), enhanced player, and offline m3u8 downloader.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  flutter_inappwebview: ^6.1.5
  media_kit: ^1.1.11
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.5
  file_picker: ^8.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
